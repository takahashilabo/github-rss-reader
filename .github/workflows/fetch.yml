name: Fetch RSS feeds

on:
  schedule:
    # 08:00 JST == 23:00 UTC (previous day)
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-rss
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Fetch feeds
        run: npm run fetch

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/data/articles.json; then
            echo "No changes to commit"
          else
            git add docs/data/articles.json
            git commit -m "chore: update articles.json ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
